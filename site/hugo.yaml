baseURL: https://annismckenzie.github.io/x-article-exporter/
languageCode: en-us
title: X Article Exporter

module:
  imports:
    - path: github.com/imfing/hextra

enableGitInfo: true

menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 1
    - name: Architecture
      pageRef: /architecture
      weight: 2
    - name: Blog
      pageRef: /blog
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    - name: GitHub
      weight: 5
      url: "https://github.com/annismckenzie/x-article-exporter"
      params:
        icon: github

params:
  description: Export X (Twitter) articles as high-quality PDFs — with optional translation and dark mode.

  navbar:
    displayTitle: true
    displayLogo: false

  theme:
    default: system
    displayToggle: true

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward

  editURL:
    enable: true
    base: "https://github.com/annismckenzie/x-article-exporter/edit/main/site"

  page:
    width: wide

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
